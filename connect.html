<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src https://tiqpivwfrnehsinreeoa.supabase.co; base-uri 'none'; form-action 'none'">
<title>Family Calendar</title>
<!--
  Connecting an AI assistant (ChatGPT, Claude, Grok …) to Family Calendar. The `mcp` Edge Function
  sends the browser here with #r=<request>; the page shows a short code that the person approves
  in the app (Family → AI assistants), then returns to the assistant. Without #r it explains how
  to add the connector. Copy this file to the GitHub Pages site next to invite.html.
-->
<style>
  :root {
    --bg: #F2F2F7;
    --card: #FFFFFF;
    --text: #1C1C1E;
    --muted: #6C6C70;
    --line: rgba(60, 60, 67, 0.14);
    --soft: rgba(60, 60, 67, 0.06);
    --button-bg: #1C1C1E;
    --button-text: #FFFFFF;
    --good: #248A3D;
    --warn: #C93400;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.04), 0 10px 30px rgba(0, 0, 0, 0.06);
    --radius: 22px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    color: var(--text);
    background: var(--bg);
    -webkit-text-size-adjust: 100%;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #000000;
      --card: #1C1C1E;
      --text: #F2F2F7;
      --muted: #98989F;
      --line: rgba(235, 235, 245, 0.14);
      --soft: rgba(235, 235, 245, 0.07);
      --button-bg: #F2F2F7;
      --button-text: #000000;
      --good: #30D158;
      --warn: #FF9F0A;
      --shadow: none;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); }
  body { min-height: 100vh; min-height: 100dvh; line-height: 1.45; }
  main {
    width: 100%;
    max-width: 560px;
    margin: 0 auto;
    padding: calc(36px + env(safe-area-inset-top)) 16px calc(32px + env(safe-area-inset-bottom));
  }
  h1, h2, .code { font-family: ui-rounded, "SF Pro Rounded", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  h1 { font-size: clamp(26px, 6.5vw, 32px); line-height: 1.15; letter-spacing: -0.015em; margin: 0 0 10px; }
  h2 { font-size: 19px; margin: 0 0 6px; }
  p { margin: 0; }
  a { color: inherit; }
  [hidden] { display: none !important; }

  .mark {
    width: 72px;
    height: 72px;
    margin: 0 0 20px;
    border-radius: 20px;
    background: var(--button-bg);
    color: var(--button-text);
    display: grid;
    place-items: center;
    box-shadow: var(--shadow);
  }
  header { text-align: center; }
  header .mark { margin-left: auto; margin-right: auto; }
  .lead { color: var(--muted); font-size: 17px; max-width: 30em; margin: 0 auto; }
  .lead strong { color: var(--text); font-weight: 600; }

  .card {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 22px;
    margin-top: 16px;
  }
  .code-card { text-align: center; margin-top: 28px; padding: 26px 22px 20px; }
  .label { font-size: 13px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
  .code {
    font-size: clamp(38px, 12vw, 54px);
    font-weight: 700;
    letter-spacing: 0.08em;
    margin: 6px 0 14px;
    font-variant-numeric: tabular-nums;
    user-select: all;
    -webkit-user-select: all;
  }
  .waiting { display: inline-flex; align-items: center; gap: 10px; color: var(--muted); font-size: 15px; }
  .pulse { width: 9px; height: 9px; border-radius: 50%; background: var(--good); animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { opacity: 0.25; transform: scale(0.8); } 50% { opacity: 1; transform: scale(1); } }
  @media (prefers-reduced-motion: reduce) { .pulse { animation: none; } }

  .button {
    display: flex;
    width: 100%;
    align-items: center;
    justify-content: center;
    gap: 8px;
    min-height: 54px;
    margin-top: 16px;
    padding: 14px 20px;
    border: 0;
    border-radius: 999px;
    background: var(--button-bg);
    color: var(--button-text);
    font: inherit;
    font-size: 17px;
    font-weight: 600;
    text-decoration: none;
    cursor: pointer;
  }
  .button:active { opacity: 0.8; }
  .quiet {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 8px 14px;
    border: 0;
    border-radius: 999px;
    background: var(--soft);
    color: var(--text);
    font: inherit;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
  }

  .qr-card { display: flex; align-items: center; gap: 20px; }
  .qr {
    flex: none;
    width: 136px;
    height: 136px;
    padding: 6px;
    border-radius: 16px;
    background: #FFFFFF;
    border: 1px solid var(--line);
  }
  .qr svg { display: block; width: 100%; height: 100%; }
  .qr-card p { color: var(--muted); font-size: 15px; }
  .qr-card strong { display: block; color: var(--text); font-size: 17px; margin-bottom: 4px; }

  .steps { counter-reset: step; list-style: none; margin: 0; padding: 0; display: grid; gap: 14px; }
  .steps li { counter-increment: step; display: grid; grid-template-columns: 30px 1fr; gap: 12px; align-items: start; font-size: 16px; }
  .steps li::before {
    content: counter(step);
    width: 30px;
    height: 30px;
    border-radius: 50%;
    background: var(--soft);
    display: grid;
    place-items: center;
    font-weight: 700;
    font-size: 15px;
  }
  .steps b { font-weight: 600; }
  .note { color: var(--muted); font-size: 14px; text-align: center; margin-top: 16px; }
  .note.warn { color: var(--warn); }

  .state { text-align: center; margin-top: 12px; }
  .state .big { font-size: 64px; line-height: 1; margin-bottom: 18px; }
  .state p { color: var(--muted); font-size: 17px; }

  .address {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-top: 10px;
    padding: 12px 12px 12px 16px;
    border-radius: 14px;
    background: var(--soft);
  }
  .address code {
    flex: 1;
    min-width: 0;
    overflow-wrap: anywhere;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 14px;
  }
  .how h2 { display: flex; align-items: center; gap: 10px; }
  .how p, .how li { color: var(--muted); font-size: 15px; }
  .how ol { margin: 8px 0 0; padding-left: 20px; display: grid; gap: 4px; }
  .how b { color: var(--text); font-weight: 600; }
  .skeleton { height: 280px; border-radius: var(--radius); background: var(--card); opacity: 0.6; margin-top: 28px; }
  footer { text-align: center; color: var(--muted); font-size: 13px; margin-top: 28px; }
</style>
</head>
<body>
<main>
  <header>
    <div class="mark" aria-hidden="true">
      <svg width="40" height="40" viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
        <rect x="5" y="8" width="26" height="25" rx="6"/>
        <path d="M5 16h26M12 5v6M24 5v6"/>
        <path d="M31.5 22.5l1.3 3.2 3.2 1.3-3.2 1.3-1.3 3.2-1.3-3.2-3.2-1.3 3.2-1.3z" fill="currentColor" stroke-width="1.4"/>
      </svg>
    </div>
    <h1 id="title"></h1>
    <p class="lead" id="lead"></p>
  </header>

  <section id="loading"><div class="skeleton"></div></section>

  <section id="pending" hidden>
    <div class="card code-card">
      <div class="label" id="code-label"></div>
      <div class="code" id="code" aria-live="polite"></div>
      <div class="waiting"><span class="pulse" aria-hidden="true"></span><span id="waiting"></span></div>
    </div>
    <a class="button" id="open-app" hidden></a>
    <div class="card qr-card" id="qr-card" hidden>
      <div class="qr" id="qr"></div>
      <p><strong id="qr-title"></strong><span id="qr-text"></span></p>
    </div>
    <div class="card">
      <h2 id="steps-title"></h2>
      <ol class="steps" id="steps"></ol>
    </div>
    <p class="note" id="expires"></p>
    <p class="note warn" id="offline" hidden></p>
    <p class="note" id="safety"></p>
  </section>

  <section id="state" class="state" hidden>
    <div class="big" id="state-icon" aria-hidden="true"></div>
    <p id="state-text"></p>
    <a class="button" id="state-button" hidden></a>
  </section>

  <section id="help" hidden>
    <div class="card">
      <h2 id="address-title"></h2>
      <p class="lead" style="margin:0;text-align:left;font-size:15px" id="address-text"></p>
      <div class="address"><code id="address"></code><button class="quiet" id="copy-address" type="button"></button></div>
    </div>
    <div class="card how" id="how"></div>
  </section>

  <footer id="footer"></footer>
</main>

<script>
"use strict";

// The `mcp` Edge Function; also the address people add to their assistant.
const API = "https://tiqpivwfrnehsinreeoa.supabase.co/functions/v1/mcp";
const APP_LINK = "weeklyplanner://ai-connect?pair=";

const NB = /^(nb|no|nn)\b/i.test(navigator.language || "");
document.documentElement.lang = NB ? "nb" : "en";
const IOS = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);

const T = NB ? {
  connectTitle: (client) => `Koble ${client} til Family Calendar`,
  genericTitle: "Koble til en KI-assistent",
  lead: (client) => `${client} vil bruke kalenderen, oppgavene, handlelisten og middagsplanen til familien din.`,
  goesBackTo: (host) => `Etterpå sendes du tilbake til ${host}.`,
  codeLabel: "Koden din",
  waiting: "Venter på godkjenning i appen …",
  openApp: "Åpne Family Calendar og godkjenn",
  qrTitle: "Skann med iPhone",
  qrText: "Pek kameraet på koden, så åpner Family Calendar seg klar til å godkjenne.",
  qrLabel: "QR-kode som åpner Family Calendar",
  stepsTitle: "Eller skriv inn koden i appen",
  steps: [
    "Åpne <b>Family Calendar</b> på telefonen.",
    "Trykk på bildene øverst på <b>I dag</b> for å komme til <b>Familie</b>, og velg <b>KI-assistenter</b>.",
    "Trykk <b>Skriv inn kode</b>, skriv koden og godkjenn.",
  ],
  expires: (minutes) => minutes <= 1 ? "Koden virker i under ett minutt til." : `Koden virker i ${minutes} minutter til.`,
  safety: "Godkjenn bare hvis du startet dette selv, akkurat nå.",
  offline: "Ingen forbindelse. Prøver igjen …",
  doneTitle: "Tilkoblet",
  doneText: (client) => `Sender deg tilbake til ${client} …`,
  continue: "Fortsett",
  deniedTitle: "Ikke tilkoblet",
  deniedText: (client) => `Du avslo i appen. Sender deg tilbake til ${client} …`,
  expiredTitle: "Koden har gått ut",
  expiredText: (client) => `Gå tilbake til ${client} og koble til på nytt.`,
  unknownTitle: "Lenken virker ikke lenger",
  unknownText: "Gå tilbake til KI-assistenten og koble til Family Calendar på nytt.",
  brokenTitle: "Tilkoblingen virker ikke",
  brokenText: "Fjern Family Calendar fra koblingene i KI-assistenten, og legg den til på nytt med adressen under.",
  theAssistant: "assistenten",
  helpTitle: "Family Calendar i ChatGPT, Claude og Grok",
  helpLead: "Spør KI-assistenten hva som skjer denne uken, be den legge til på handlelisten eller planlegge middagene – den jobber i familiekalenderen akkurat som appen.",
  addressTitle: "Adressen til koblingen",
  addressText: "Lim inn denne adressen der assistenten ber om en MCP-server eller egendefinert kobling.",
  copy: "Kopier",
  copied: "Kopiert",
  how: [
    ["Claude", "Innstillinger → <b>Connectors</b> → <b>Add custom connector</b>. Lim inn adressen og trykk <b>Connect</b>. Du får en kode som du godkjenner i appen."],
    ["ChatGPT", "Innstillinger → <b>Apps & Connectors</b> → <b>Advanced settings</b> → slå på <b>Developer mode</b>. Velg så <b>Create</b>, lim inn adressen og velg <b>OAuth</b>. Du får en kode som du godkjenner i appen."],
    ["Grok og andre", "Lag en personlig nøkkel i appen (<b>Familie → KI-assistenter → Lag en personlig nøkkel</b>). Gi verktøyet adressen og nøkkelen som <b>Authorization: Bearer</b> …"],
  ],
  privacy: "Assistenten ser det du ser i appen, og det den leser sendes til selskapet bak den. Wi-Fi-passord, koder og alt som er merket som sensitivt i familieboka, deles aldri. Du kan koble fra når som helst i appen.",
  footer: "Family Calendar",
} : {
  connectTitle: (client) => `Connect ${client} to Family Calendar`,
  genericTitle: "Connect an AI assistant",
  lead: (client) => `${client} would like to use your family's calendar, tasks, shopping list and dinner plan.`,
  goesBackTo: (host) => `Afterwards you are sent back to ${host}.`,
  codeLabel: "Your code",
  waiting: "Waiting for approval in the app …",
  openApp: "Open Family Calendar to approve",
  qrTitle: "Scan with your iPhone",
  qrText: "Point the camera at the code and Family Calendar opens, ready to approve.",
  qrLabel: "QR code that opens Family Calendar",
  stepsTitle: "Or type the code in the app",
  steps: [
    "Open <b>Family Calendar</b> on your phone.",
    "Tap the pictures at the top of <b>Today</b> to get to <b>Family</b>, and choose <b>AI assistants</b>.",
    "Tap <b>Enter code</b>, type the code and approve.",
  ],
  expires: (minutes) => minutes <= 1 ? "The code works for less than a minute more." : `The code works for ${minutes} more minutes.`,
  safety: "Only approve if you started this yourself, just now.",
  offline: "No connection. Trying again …",
  doneTitle: "Connected",
  doneText: (client) => `Taking you back to ${client} …`,
  continue: "Continue",
  deniedTitle: "Not connected",
  deniedText: (client) => `You declined in the app. Taking you back to ${client} …`,
  expiredTitle: "The code has expired",
  expiredText: (client) => `Go back to ${client} and connect again.`,
  unknownTitle: "This link no longer works",
  unknownText: "Go back to your AI assistant and connect Family Calendar again.",
  brokenTitle: "This connection doesn't work",
  brokenText: "Remove Family Calendar from your assistant's connectors, and add it again with the address below.",
  theAssistant: "the assistant",
  helpTitle: "Family Calendar in ChatGPT, Claude and Grok",
  helpLead: "Ask your AI assistant what's on this week, have it add to the shopping list or plan dinners – it works in your family calendar, just like the app.",
  addressTitle: "Connector address",
  addressText: "Paste this address where your assistant asks for an MCP server or a custom connector.",
  copy: "Copy",
  copied: "Copied",
  how: [
    ["Claude", "Settings → <b>Connectors</b> → <b>Add custom connector</b>. Paste the address and press <b>Connect</b>. You get a code to approve in the app."],
    ["ChatGPT", "Settings → <b>Apps & Connectors</b> → <b>Advanced settings</b> → turn on <b>Developer mode</b>. Then choose <b>Create</b>, paste the address and pick <b>OAuth</b>. You get a code to approve in the app."],
    ["Grok and others", "Make a personal key in the app (<b>Family → AI assistants → Make a personal key</b>). Give the tool the address, and the key as <b>Authorization: Bearer</b> …"],
  ],
  privacy: "The assistant sees what you see in the app, and what it reads is sent to the company behind it. Wi-Fi passwords, codes and anything marked sensitive in the family book are never shared. You can disconnect at any time in the app.",
  footer: "Family Calendar",
};

const $ = (id) => document.getElementById(id);

function show(id) {
  for (const section of document.querySelectorAll("main > section")) section.hidden = section.id !== id;
}

function heading(title, lead) {
  $("title").textContent = title;
  $("lead").textContent = lead ?? "";
  $("lead").hidden = !lead;
  document.title = title;
}

// Only ever sends the browser back to the assistant's own address (never a script).
function safeRedirect(url) {
  try {
    const parsed = new URL(url);
    return /^(javascript|data|vbscript|file):$/i.test(parsed.protocol) ? null : parsed.href;
  } catch {
    return null;
  }
}

function state(icon, title, text, redirect) {
  heading(title);
  $("state-icon").textContent = icon;
  $("state-text").textContent = text;
  const button = $("state-button");
  button.hidden = !redirect;
  if (redirect) {
    button.href = redirect;
    button.textContent = T.continue;
  }
  show("state");
}

async function copy(text, button) {
  try {
    await navigator.clipboard.writeText(text);
  } catch {
    const field = document.createElement("textarea");
    field.value = text;
    document.body.append(field);
    field.select();
    document.execCommand("copy");
    field.remove();
  }
  button.textContent = T.copied;
  setTimeout(() => { button.textContent = T.copy; }, 1800);
}

function qrSvg(text) {
  const qr = qrcode(0, "M");
  qr.addData(text);
  qr.make();
  const size = qr.getModuleCount();
  let path = "";
  for (let row = 0; row < size; row += 1) {
    for (let col = 0; col < size; col += 1) {
      if (qr.isDark(row, col)) path += `M${col + 3} ${row + 3}h1v1h-1z`;
    }
  }
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${size + 6} ${size + 6}" shape-rendering="crispEdges" role="img">` +
    `<rect width="100%" height="100%" fill="#fff"/><path d="${path}" fill="#000"/></svg>`;
}

// ---------------------------------------------------------------------------
// Connecting
// ---------------------------------------------------------------------------

function connect(requestId) {
  let client = null;
  let shownCode = null;
  let deadline = 0;
  let delay = 2000;
  let timer = null;
  let finished = false;

  $("code-label").textContent = T.codeLabel;
  $("waiting").textContent = T.waiting;
  $("steps-title").textContent = T.stepsTitle;
  $("steps").innerHTML = T.steps.map((step) => `<li><span>${step}</span></li>`).join("");
  $("safety").textContent = T.safety;
  $("offline").textContent = T.offline;
  $("qr-title").textContent = T.qrTitle;
  $("qr-text").textContent = T.qrText;

  function tickExpiry() {
    if (finished || !deadline) return;
    const minutes = Math.ceil((deadline - Date.now()) / 60000);
    $("expires").textContent = T.expires(Math.max(minutes, 1));
  }
  setInterval(tickExpiry, 15000);

  function pending(data) {
    client = data.client || client;
    heading(T.connectTitle(client || T.theAssistant), `${T.lead(client || T.theAssistant)} ${data.host ? T.goesBackTo(data.host) : ""}`.trim());
    if (data.code !== shownCode) {
      shownCode = data.code;
      $("code").textContent = data.code;
      const link = APP_LINK + data.code.replace(/[^A-Z]/g, "");
      if (IOS) {
        $("open-app").href = link;
        $("open-app").textContent = T.openApp;
        $("open-app").hidden = false;
      } else {
        $("qr").innerHTML = qrSvg(link);
        $("qr").firstChild.setAttribute("aria-label", T.qrLabel);
        $("qr-card").hidden = false;
      }
    }
    deadline = Date.now() + (data.expires_in ?? 900) * 1000;
    tickExpiry();
    show("pending");
  }

  function handle(data) {
    client = data.client || client;
    const name = client || T.theAssistant;
    switch (data.status) {
      case "pending":
        pending(data);
        return;
      case "approved": {
        finished = true;
        const redirect = safeRedirect(data.redirect);
        state("✅", T.doneTitle, T.doneText(name), redirect);
        if (redirect) setTimeout(() => location.replace(redirect), 700);
        return;
      }
      case "denied": {
        finished = true;
        const redirect = safeRedirect(data.redirect);
        state("✋", T.deniedTitle, T.deniedText(name), redirect);
        if (redirect) setTimeout(() => location.replace(redirect), 2500);
        return;
      }
      case "expired":
        finished = true;
        state("⏱️", T.expiredTitle, T.expiredText(name));
        return;
      default:
        finished = true;
        state("🔗", T.unknownTitle, T.unknownText);
    }
  }

  async function poll() {
    clearTimeout(timer);
    if (finished) return;
    try {
      const response = await fetch(`${API}/status?request=${encodeURIComponent(requestId)}`, { cache: "no-store" });
      if (!response.ok) throw new Error(String(response.status));
      $("offline").hidden = true;
      delay = 2000;
      handle(await response.json());
    } catch {
      $("offline").hidden = shownCode === null ? true : false;
      if (shownCode === null) show("loading");
      delay = Math.min(delay * 1.5, 10000);
    }
    if (!finished) timer = setTimeout(poll, delay);
  }

  // Coming back from the app should not wait for the next poll.
  document.addEventListener("visibilitychange", () => { if (!document.hidden) poll(); });
  window.addEventListener("focus", poll);
  poll();
}

// ---------------------------------------------------------------------------
// How to connect
// ---------------------------------------------------------------------------

function help(broken) {
  if (broken) {
    heading(T.brokenTitle, T.brokenText);
  } else {
    heading(T.helpTitle, T.helpLead);
  }
  $("address-title").textContent = T.addressTitle;
  $("address-text").textContent = T.addressText;
  $("address").textContent = API;
  const button = $("copy-address");
  button.textContent = T.copy;
  button.addEventListener("click", () => copy(API, button));
  $("how").innerHTML = T.how.map(([name, text]) => `<h2>${name}</h2><p>${text}</p>`).join('<div style="height:18px"></div>') +
    `<div style="height:18px"></div><p>${T.privacy}</p>`;
  show("help");
}

$("footer").textContent = T.footer;
const params = new URLSearchParams(location.hash.slice(1));
const requestId = params.get("r");
if (requestId && /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(requestId)) {
  heading(T.genericTitle);
  connect(requestId);
} else {
  help(params.has("error"));
}
</script>
</body>
